<div role="listitem">
  <a class="library-search-result" href="{{link}}" data-library-link>
    <div class="library-search-result-artwork" data-kind="{{result_kind}}">
      <div class="library-search-result-image">{{cover}}</div>
      <span class="library-search-result-badge" role="img" aria-label="{{kind}}">{{kind_icon}}</span>
    </div>
    <span class="library-search-result-body">
      <span class="library-search-result-title">{{title}}</span>
      <span class="library-search-result-subtitle">{{subtitle}}</span>
    </span>
    <span class="library-search-result-chevron">{{chevron}}</span>
  </a>
</div>
