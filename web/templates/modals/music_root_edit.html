<div class="modal" id="modal-music-root-edit" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-music-root-edit-title">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" tabindex="-1">
    <div class="modal-header">
      <h2 id="modal-music-root-edit-title">Edit music folder</h2>
    </div>
    <form class="stack" id="form-music-root-edit">
      <input type="hidden" name="root_id" />
      <label for="music-root-edit-path">Folder path</label>
      <input id="music-root-edit-path" name="path" type="text" placeholder="Music/Library or D:/Music" />
      <p class="hint">Paths are relative to the config file if not absolute.</p>
      <div class="inline-error" id="music-root-edit-error" role="alert"></div>
      <div class="row">
        <button class="button ghost" type="button" data-close>Cancel</button>
        <button class="button" type="submit">Save changes</button>
      </div>
    </form>
  </div>
</div>
