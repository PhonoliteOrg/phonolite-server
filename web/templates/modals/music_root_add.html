<div class="modal" id="modal-music-root-add">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card">
    <div class="modal-header">
      <h3>Add music folder</h3>
    </div>
    <form class="stack" id="form-music-root-add">
      <label>Folder path</label>
      <input name="path" type="text" placeholder="Music/Library or D:/Music" />
      <p class="hint">Paths are relative to the config file if not absolute.</p>
      <div class="inline-error" id="music-root-add-error"></div>
      <div class="row">
        <button class="button ghost" type="button" data-close>Cancel</button>
        <button class="button" type="submit">Add folder</button>
      </div>
    </form>
  </div>
</div>
