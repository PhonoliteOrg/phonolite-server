<div class="modal" id="modal-reindex" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-reindex-title">
  <div class="modal-backdrop" data-close-reindex></div>
  <div class="modal-card" tabindex="-1">
    <div class="modal-header">
      <h2 id="modal-reindex-title">Reindex library</h2>
    </div>
    <p>
      This will delete the library index and all downloaded metadata/artwork, then rescan the music
      folder. Retained metadata imports will also be cleared. Keep a downloaded backup to restore them later.
    </p>
    <div class="row right">
      <button type="button" class="button ghost" data-close-reindex>Cancel</button>
      <button type="button" id="confirm-reindex" class="button warn">Reindex</button>
    </div>
  </div>
</div>
