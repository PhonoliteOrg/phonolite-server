  <div class="modal-card server-actions-card" tabindex="-1">
    <div class="modal-header">
      <div class="server-actions-heading">
        <svg class="server-actions-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v8M7.03 4.47a9 9 0 1 0 9.94 0"/></svg>
        <h2 id="nav-modal-title">Server actions</h2>

    </div>
    <p class="muted server-actions-description" id="nav-modal-description">Manage this server or end your admin session.</p>

      <form class="server-action-form" method="post" action="/logout">
        <button class="server-action" type="submit">
          <svg class="server-action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span class="server-action-copy"><span class="server-action-label">Log out</span><span class="server-action-description">End your admin session.</span></span>
        </button>
      </form>
      <button class="server-action" type="button" data-action="restart">
        <svg class="server-action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2.6 8.4M3 4v6h6"/></svg>
        <span class="server-action-copy"><span class="server-action-label">Restart server</span><span class="server-action-description">Restart Phonolite and interrupt active streams.</span></span>
      </button>
      <button class="server-action danger" type="button" data-action="shutdown">
        <svg class="server-action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v8M7.03 4.47a9 9 0 1 0 9.94 0"/></svg>
        <span class="server-action-copy"><span class="server-action-label">Shut down</span><span class="server-action-description">Stop Phonolite and end active streams.</span></span>

    </div>
