<div class="page-title">
  <div>
    <h2>Activity</h2>
    <p class="muted">Live status, recent activity, and indexing issues.</p>
  </div>
  <span class="tag">Status: {{status_label}}</span>
</div>
{{status_block}}
<div class="grid two activity-grid">
  <div class="card activity-card">
    <div class="row space-between">
      <div>
        <h3>Activity stream</h3>
        <p class="muted">What the server is doing right now.</p>
      </div>
      <div class="row">
        <span class="tag">{{event_count}} events</span>
        <button
          class="button ghost"
          type="button"
          id="clear-activity"
          data-count="{{stored_count}}"
        >
          Clear activity
        </button>
      </div>
    </div>
    <div class="activity-stream">
      {{events}}
    </div>
  </div>
  <div class="card issues-card">
    <div class="row space-between">
      <h3>Indexing issues</h3>
      <span class="tag">{{issue_count}} files</span>
    </div>
    {{tag_errors}}
  </div>
</div>
