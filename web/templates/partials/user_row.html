<tr class="user-row" data-user-id="{{id}}" data-username="{{username_raw}}" data-role="{{role}}" data-disabled="{{disabled}}" data-protected="{{protected}}">
  <td class="select-cell">{{checkbox}}</td>
  <td class="user-name">{{username}}</td>
  <td class="user-role"><span class="role-badge {{role}}">{{role_label}}</span></td>
  <td class="user-sessions">{{active_sessions}}</td>
  <td class="user-last-login">{{last_login}}</td>
  <td class="user-actions">{{edit_button}}{{sessions_button}}{{delete_button}}</td>
</tr>
