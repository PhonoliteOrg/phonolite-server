<div class="modal" id="modal-metadata-add" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-metadata-add-title">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" tabindex="-1">
    <div class="modal-header">
      <h2 id="modal-metadata-add-title">Add metadata source</h2>
    </div>
    <form class="stack" id="form-metadata-add">
      <label for="metadata-add-provider">Provider</label>
      <select name="provider" id="metadata-add-provider">
        <option value="theaudiodb">TheAudioDB</option>
        <option value="musicbrainz">MusicBrainz</option>
      </select>
      <div class="provider-fields" data-provider="theaudiodb">
        <label for="metadata-add-api-key">API key</label>
        <input id="metadata-add-api-key" name="api_key" type="password" placeholder="TheAudioDB API key" />
      </div>
      <div class="provider-fields" data-provider="musicbrainz">
        <label for="metadata-add-user-agent">User agent</label>
        <input id="metadata-add-user-agent"
          name="user_agent"
          type="text"
          placeholder="AppName/1.0 (contact@example.com)"
        />
      </div>
      <div class="inline-error" id="metadata-add-error" role="alert"></div>
      <div class="row space-between">
        <button class="button ghost" type="button" id="metadata-add-test">Test</button>
        <div class="row">
          <button class="button ghost" type="button" data-close>Cancel</button>
          <button class="button" type="submit">Add source</button>
        </div>
      </div>
    </form>
  </div>
</div>
