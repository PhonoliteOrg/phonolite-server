<div class="modal" id="modal-sessions" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-sessions-title">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" tabindex="-1">
    <div class="row space-between"><h2 id="modal-sessions-title">Sign out all app sessions</h2><button type="button" class="icon-button" data-close aria-label="Close">&times;</button></div>
    <p id="sessions-message"></p>
    <div id="sessions-error" class="inline-error" role="alert"></div>
    <div class="row right"><button type="button" class="button ghost" data-close>Cancel</button><button type="button" id="confirm-sessions" class="button danger">Sign out all app sessions</button></div>
  </div>
</div>
