<div class="search-card">
  <form method="get" action="/library" class="search-form" data-library-search role="search" aria-label="Search library">
    <div class="search-input-wrapper">
        <label class="sr-only" for="library-search">Search artists, albums, and tracks</label>
        <input id="library-search" type="search" name="search" placeholder="Search artists, albums, tracks…" value="{{value}}" class="search-input" />
        <div class="search-icon-container">{{clear_button}}</div>
    </div>
    {{hidden_filter}}
  </form>
</div>
