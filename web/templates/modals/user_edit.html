<div class="modal" id="modal-edit" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-edit-title">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" tabindex="-1">
    <div class="modal-header">
      <h2 id="modal-edit-title">Edit user</h2>
    </div>
    <form id="form-edit-user">
      <input type="hidden" name="user_id" />
      <div class="form-group">
        <label for="user-edit-username">Username</label>
        <input id="user-edit-username" type="text" name="username" required autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="user-edit-password">Password (leave blank to keep)</label>
        <input id="user-edit-password" type="password" name="password" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="user-edit-role">Role</label>
        <select id="user-edit-role" name="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
          <option value="superadmin">Superadmin</option>
        </select>
      </div>
      <div id="edit-user-error" class="inline-error" role="alert"></div>
      <div class="row right">
        <button type="button" class="button ghost" data-close>Cancel</button>
        <button type="submit" class="button primary">Save</button>
      </div>
    </form>
  </div>
</div>
